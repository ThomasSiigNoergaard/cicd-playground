name: Bug report
description: Something is broken in the app, the pipelines or the infrastructure.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not report security vulnerabilities here** - use private vulnerability reporting (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API (.NET)
        - Container / Dockerfile
        - CI / GitHub Actions
        - Terraform / AWS
        - Docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or workflow run link
      render: shell
