# -----------------------------------------------------------------------------
# Release: turn conventional commits on main into SemVer tags + GitHub releases.
#
# How a version is chosen (semantic-release conventions):
#   fix: ...                      -> patch  (v1.2.3 -> v1.2.4)
#   feat: ...                     -> minor  (v1.2.3 -> v1.3.0)
#   feat!: ... / BREAKING CHANGE: -> major  (v1.2.3 -> v2.0.0)
#   chore:, docs:, ci:, ...       -> no release (default_bump is false)
#
# With squash merges the PR title becomes the commit subject on main, which is
# why pr-title.yml enforces conventional PR titles.
#
# Two-stage design (same pattern as tv2/agent-skills):
#   1. `version` computes the next version in DRY-RUN mode. It needs only
#      read access, so the analysis step can never write anything.
#   2. `release` calls the reusable _release.yml, which is the only place
#      holding `contents: write`. The write path is small and easy to audit.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bump:
        description: Force a bump even without releasable commits
        type: choice
        default: "false"
        options: ["false", patch, minor, major]

permissions: {}

# Never compute two versions in parallel: both runs would pick the same tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - name: Compute version (dry run)
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          # Only feat/fix/breaking commits produce a release.
          default_bump: "false"
          force_bump: ${{ inputs.force_bump || 'false' }}
          release_branches: ^main$

      - name: Summary
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          PREVIOUS_TAG: ${{ steps.tag.outputs.previous_tag }}
          RELEASE_TYPE: ${{ steps.tag.outputs.release_type }}
        run: |
          if [ -n "$NEW_TAG" ]; then
            echo "### Next release: \`$NEW_TAG\` ($RELEASE_TYPE, previous \`$PREVIOUS_TAG\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: no feat/fix/breaking commits since \`$PREVIOUS_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.new_tag }}
      changelog: ${{ needs.version.outputs.changelog }}
