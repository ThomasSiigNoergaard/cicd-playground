# -----------------------------------------------------------------------------
# Terraform: static checks, PR plans and gated applies.
#
#   pull_request -> fmt, validate, tflint, Trivy IaC scan, plan dev + prod and
#                   post each plan as a (single, updated) PR comment
#   push to main -> same static checks, then apply dev, then apply prod
#                   (prod waits for a required reviewer on the `prod` env)
#
# AWS access is OIDC only (see docs/oidc.md). Until terraform/bootstrap has
# been applied and the variables below are set, every AWS job is skipped and
# explains why in the job summary, so the workflow stays green.
#
#   Repository variables:  AWS_REGION, TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN
#   Environment variables: AWS_DEPLOY_ROLE_ARN (on `dev` and on `prod`)
# -----------------------------------------------------------------------------
name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions: {}

# PR runs may be cancelled when superseded. Runs on main are queued, never
# cancelled: killing a running `terraform apply` can leave a stale state lock
# and half-applied infrastructure.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Must satisfy required_version (>= 1.10 for native S3 locking). The
  # `env` context is not available in a reusable workflow call's `with:`, so
  # the apply jobs below repeat this value; keep them in sync.
  TF_VERSION: "1.13.4"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks: no cloud credentials needed.
  # ---------------------------------------------------------------------------
  static:
    name: fmt / validate / tflint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper captures stdout into step outputs; we do not need that
          # and it makes plain shell output harder to read.
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      # The same script developers run locally, so CI and laptops agree.
      - name: validate + tflint (all stacks)
        env:
          # tflint --init downloads the AWS ruleset from GitHub releases;
          # authenticating avoids anonymous API rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/terraform-check.sh

  # ---------------------------------------------------------------------------
  # IaC misconfiguration scan with Trivy, uploaded to code scanning.
  # ---------------------------------------------------------------------------
  iac-scan:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          # Findings are surfaced as code scanning alerts rather than failing
          # the build. Some findings are deliberate lab trade-offs (e.g. a
          # public ALB on HTTP); see docs/terraform.md.
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ---------------------------------------------------------------------------
  # Preflight: decide whether AWS jobs can run. It deliberately has no
  # `environment`, so GitHub does not auto-create the dev/prod environments
  # (without protection rules) before you have configured them.
  # ---------------------------------------------------------------------------
  preflight:
    name: AWS configuration check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      apply: ${{ steps.check.outputs.apply }}
      plan: ${{ steps.check.outputs.plan }}
    steps:
      - name: Check repository variables
        id: check
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          missing=()
          [ -n "$AWS_REGION" ]      || missing+=("AWS_REGION")
          [ -n "$TF_STATE_BUCKET" ] || missing+=("TF_STATE_BUCKET")
          base_ok=true; [ ${#missing[@]} -eq 0 ] || base_ok=false

          plan_ok=$base_ok
          [ -n "$AWS_PLAN_ROLE_ARN" ] || { plan_ok=false; missing+=("AWS_PLAN_ROLE_ARN"); }
          # Fork PRs never get an OIDC token or write access, so plans cannot
          # run for them (by design, not a misconfiguration).
          [ "$IS_FORK" = "true" ] && plan_ok=false

          echo "apply=$base_ok" >> "$GITHUB_OUTPUT"
          echo "plan=$plan_ok"  >> "$GITHUB_OUTPUT"

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### :information_source: AWS jobs skipped"
              echo
              echo "Missing repository variables: \`${missing[*]}\`."
              echo
              echo "This is expected until you have applied \`terraform/bootstrap\`."
              echo "Follow steps 4-5 of the README walkthrough, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=AWS not configured::Skipping AWS jobs. Missing: ${missing[*]}"
          elif [ "$IS_FORK" = "true" ]; then
            echo "Plans are skipped for pull requests from forks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AWS variables present - plan/apply jobs will run." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Plan (pull requests). One matrix leg per environment.
  # No `environment:` here on purpose: the OIDC subject is then
  # `repo:<owner>/<repo>:pull_request`, which is exactly what the read-only
  # plan role trusts. Adding an environment would change the subject.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (${{ matrix.environment }})
    if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.plan == 'true' }}
    needs: [static, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # request the OIDC token for AWS
      pull-requests: write # create/update the plan comment
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.environment }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${TF_VAR_aws_region}"

      # The plan exit code is captured instead of failing immediately, so a
      # failing plan is still posted to the PR for the author to read.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=2m -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            terraform show -no-color tfplan > plan.txt
            outcome=success
          else
            cp plan.log plan.txt
            outcome=failure
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan: ${{ matrix.environment }} ($outcome)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          OUTCOME: ${{ steps.plan.outputs.outcome }}
          PLAN_FILE: terraform/environments/${{ matrix.environment }}/plan.txt
        with:
          # Values are passed through env vars rather than ${{ }} inside the
          # script, which avoids script injection from untrusted content.
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const outcome = process.env.OUTCOME;
            // A hidden marker identifies "our" comment so later pushes update
            // it in place instead of adding a new comment each time.
            const marker = `<!-- terraform-plan:${env} -->`;
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const max = 60000; // GitHub comments are limited to 65536 chars
            if (plan.length > max) {
              plan = '... (truncated, see the job summary for the full plan)\n' + plan.slice(-max);
            }
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(no summary line)'])[0];
            const icon = outcome === 'success' ? ':white_check_mark:' : ':x:';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### ${icon} Terraform plan: \`${env}\``,
              '',
              `**${summary}**`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
              '',
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)} - [workflow run](${runUrl})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: ${{ steps.plan.outputs.outcome != 'success' }}
        run: |
          echo "::error::terraform plan failed for ${{ matrix.environment }}; see the PR comment or job summary."
          exit 1

  # ---------------------------------------------------------------------------
  # Apply (main). dev first, then prod. Each job runs in its GitHub
  # environment, so the OIDC subject is `...:environment:<env>` and only the
  # matching deploy role can be assumed. Protection rules on `prod` (required
  # reviewers, main-only) pause the prod job until someone approves.
  # ---------------------------------------------------------------------------
  apply-dev:
    name: Apply (dev)
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.preflight.outputs.apply == 'true' }}
    needs: [static, preflight]
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      environment: dev
      terraform-version: "1.13.4"
    permissions:
      contents: read
      id-token: write

  apply-prod:
    name: Apply (prod)
    needs: [apply-dev]
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      environment: prod
      terraform-version: "1.13.4"
    permissions:
      contents: read
      id-token: write
