# -----------------------------------------------------------------------------
# CodeQL "advanced setup".
#
# GitHub also offers "default setup" (one click in Settings, no YAML). This
# advanced setup is used instead so you can see and control exactly what runs:
# languages, build mode, query suites and triggers. Do not enable default
# setup at the same time; GitHub rejects SARIF uploads from advanced setup
# while default setup is active.
# -----------------------------------------------------------------------------
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan picks up new queries even when the code has not changed.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compiled language: "manual" means CodeQL observes OUR build
          # command, which gives the most precise results. "none" (buildless)
          # is faster but less accurate; "autobuild" guesses the command.
          - language: csharp
            build-mode: manual
          # The "actions" language analyses the workflow files themselves for
          # issues like script injection and over-privileged tokens.
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        if: ${{ matrix.language == 'csharp' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds more (lower precision) security queries on
          # top of the default suite. security-and-quality adds code quality.
          queries: security-extended

      - name: Build (observed by CodeQL)
        if: ${{ matrix.build-mode == 'manual' }}
        env:
          CI: "true"
        run: |
          dotnet restore --locked-mode
          dotnet build --no-restore -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
