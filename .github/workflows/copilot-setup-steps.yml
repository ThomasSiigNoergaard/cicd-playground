# Prepares the ephemeral environment the Copilot coding agent works in.
#
# When you assign an issue to Copilot, it boots a GitHub Actions runner, runs
# the job below (it MUST be named `copilot-setup-steps`), and then starts
# working. Pre-installing the toolchain here means the agent can build, test
# and lint immediately instead of discovering and installing tools by trial
# and error. See docs/ai-tooling.md.
#
# The push/pull_request triggers only exist so changes to this file are
# validated in CI; the agent itself does not need them.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Copilot gets its own token for its work; this job only needs to read code.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Restore .NET packages
        run: dotnet restore

      - name: Initialise tflint plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl"
        env:
          # Avoids GitHub API rate limits when downloading the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}
